<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Lernovique - University Online Learning Platform</title>
  <meta name="description" content="The academic course module or lecture resource you requested was not found.">
  <link rel="icon" type="image/svg+xml" href="../assets/logo.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .error-page-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      background: linear-gradient(135deg, rgba(79, 70, 229, 0.05) 0%, rgba(6, 182, 212, 0.05) 100%);
    }
    .error-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-xl);
      padding: 3.5rem 2rem;
      max-width: 580px;
      box-shadow: var(--shadow-xl);
    }
    .error-code {
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      font-family: var(--font-heading);
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <div class="error-page-container">
    <div class="error-card">
      <div class="brand-badge" style="justify-content: center; margin-bottom: 1.5rem;">
        <img src="../assets/logo.svg" alt="Lernovique" class="brand-logo-img" style="width: 48px; height: 48px;">
        <span>Lernovique</span>
      </div>

      <div class="error-code">404</div>
      <h1 style="font-size: 1.8rem; margin-bottom: 0.75rem;">Lecture Page Not Found</h1>
      <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem;">
        The academic syllabus path, lecture video link, or assignment resource you requested does not exist or has been archived by the department chair.
      </p>

      <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
        <a href="dashboard.html" class="btn btn-primary">
          <i class="fa-solid fa-gauge-high"></i> Return to Dashboard
        </a>
        <a href="../index.html" class="btn btn-outline">
          <i class="fa-solid fa-house"></i> Home Page
        </a>
      </div>
    </div>
  </div>

  <script src="../js/app.js"></script>
</body>
</html>

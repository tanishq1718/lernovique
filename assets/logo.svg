<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#4F46E5" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded soft shield -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#EEF2FF" />
  
  <!-- Stylized L path with rounded caps -->
  <path d="M 32 24 
           L 32 68 
           C 32 73, 36 76, 42 76 
           L 68 76 
           C 71.5 76, 73 72.5, 70.5 70 
           L 44 70 
           C 41 70, 40 68, 40 65 
           L 40 24 
           C 40 20.5, 32 20.5, 32 24 Z" 
        fill="url(#primaryGrad)" 
        filter="url(#glow)"/>

  <!-- Upward growth arrow / spark leaf in cyan accent -->
  <path d="M 52 46 
           L 66 32 
           L 58 32 
           L 70 20 
           L 70 34 
           L 63 34 
           L 74 46 
           C 74.8 46.9, 73.8 48, 72.5 48 
           L 53.5 48 
           C 51.8 48, 51 46.8, 52 46 Z" 
        fill="url(#cyanGrad)" />

  <!-- Accent dot / beacon -->
  <circle cx="72" cy="18" r="4.5" fill="#F59E0B" />
</svg>
